<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <span class="titlefurigana">と ら ふ だ </span>
        <h1 class="toratitle">寅札 tigercards</h1>
        </nav>
        <h2>Select a Flashcard Set</h2>
        <ul>
            {% for set in sets %}
            <li class="setlinkli"><a class="setlink" href="{{ url_for('view_set', set_name=set) }}">{{ set|capitalize }}</a></li>
            {% endfor %}
        </ul>
</body>
</html>
